<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f6f1">
    <meta name="description" content="Organize suas tarefas do dia com simplicidade.">
    <title>Meu Dia | Lista de tarefas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="page-shell">
        <header class="page-header">
            <p class="eyebrow"><span class="eyebrow-mark" aria-hidden="true"></span> SEU ESPAÇO, SEU RITMO</p>
            <h1>Meu Dia<span class="title-period">.</span></h1>
            <p class="today-date" id="today-date"></p>
            <p class="subtitle">Um passo de cada vez. O que importa hoje?</p>
        </header>

        <section class="todo-app" aria-label="Lista de tarefas">
            <form class="task-form" id="task-form">
                <label class="sr-only" for="task-input">Descreva uma tarefa</label>
                <input
                    id="task-input"
                    name="task"
                    type="text"
                    maxlength="160"
                    placeholder="Ex.: planejar a semana..."
                    autocomplete="off"
                >
                <button class="add-button" type="submit"><span aria-hidden="true">+</span> Adicionar</button>
            </form>

            <div class="list-toolbar">
                <div class="list-heading">
                    <h2>Suas tarefas</h2>
                    <span class="task-count" id="task-count">0</span>
                </div>
                <nav class="filters" aria-label="Filtrar tarefas">
                    <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">Todas</button>
                    <button class="filter-button" type="button" data-filter="pending" aria-pressed="false">A fazer</button>
                    <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Feitas</button>
                </nav>
            </div>

            <ul class="task-list" id="task-list" aria-label="Tarefas"></ul>

            <div class="empty-state" id="empty-state">
                <span class="empty-icon" aria-hidden="true">✳</span>
                <p class="empty-title">Tudo começa com uma ideia.</p>
                <p class="empty-copy">Adicione uma tarefa e tire os planos da cabeça.</p>
            </div>

            <footer class="list-footer">
                <p class="progress-copy" id="progress-copy" aria-live="polite">Seu dia está só começando.</p>
                <button class="clear-button" id="clear-completed" type="button" hidden>Limpar concluídas</button>
            </footer>
        </section>

        <p class="privacy-note"><span aria-hidden="true">↳</span> Suas tarefas ficam salvas neste dispositivo.</p>
    </main>
</body>
</html>
